---
# Purpose: CI quality gates for tests, linting, and type checking.

name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Tests and quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest --tb=short --cov=src --cov-report=term --cov-fail-under=70

      - name: Run Ruff
        run: ruff check .

      - name: Check production-refactor formatting
        # The legacy repository is not yet uniformly Ruff-formatted (108 files
        # at Phase 0 baseline). Scope this gate to the refactor-owned Python
        # paths to avoid a noisy repository-wide rewrite.
        run: >-
          ruff format --check
          src/backend/application
          src/frontend/adapters/mcp_server
          src/backend/mcp
          src/backend/graph/builder.py
          src/backend/graph/events.py
          src/backend/graph/executor.py
          src/backend/graph/metrics.py
          tests/test_rag_application_service.py
          tests/test_mcp_server.py
          tests/test_tool_catalog_policy.py

      - name: Run mypy
        run: mypy src/
