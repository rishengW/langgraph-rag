---
# Purpose: CI quality gates for tests, linting, and type checking.

name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Tests and quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest --tb=short --cov=src --cov-report=term --cov-fail-under=70

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src/
