---
# Purpose: CI quality gates for tests, linting, and type checking.

name: CI

on:
  push:
    branches:
      - main
      - production
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest --tb=short --cov=src --cov-report=term --cov-fail-under=70

      - name: Run Ruff
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy src/

      - name: Audit dependencies
        # Known-vulnerable pins in the locked runtime stack are tracked
        # separately; keep this advisory until the pins are upgraded so the
        # gate does not mask test/lint failures.
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip audit -r requirements.txt -r requirements-dev.txt --progress-off
