# Default non-secret runtime configuration.
# Secrets such as DASHSCOPE_API_KEY and API_KEY must stay in environment
# variables or .env. Leave api_key empty here so local development does not
# require Authorization headers.

qwen_model: qwen-plus
llm_provider: dashscope
deepseek_model: deepseek-v4-pro
deepseek_base_url: https://api.deepseek.com
embedding_model: text-embedding-v4
embedding_dimension: 1024
embedding_batch_size: 10
chroma_dir: .chroma
collection_name: rag-chroma
chunk_size: 100
chunk_overlap: 50
source_urls:
  - "https://help.aliyun.com/zh/pai/user-guide/use-pai-model-guidelines-in-claude-code?spm=a2c4g.11186623.help-menu-30347.d_3_2_4.3d354f74THB0pK&scm=20140722.H_2990607._.OR_help-T_cn~zh-V_1"
  - "https://help.aliyun.com/zh/pai/user-guide/llm-fine-tuning-experience?spm=5176.30275541.aillm.1.17b42f3dcoHCyA&scm=20140722.S_%E6%88%91%E8%AE%B0%E5%BE%97%E6%9C%89%E4%B8%AA%E6%96%87%E6%A1%A3%E9%A1%B5%E9%9D%A2%E4%B8%93%E9%97%A8%E5%B0%86%E5%BE%AE%E8%B0%83%E7%9A%84%E5%90%84%E4%B8%AA%E6%96%B9%E6%B3%95%E7%9A%84%E5%9C%A8%E5%93%AA%E9%87%8C%E6%B2%A1%E6%89%BE%E5%88%B0._.RL_%E6%88%91%E8%AE%B0%E5%BE%97%E6%9C%89%E4%B8%AA%E6%96%87%E6%A1%A3%E9%A1%B5%E9%9D%A2%E4%B8%93%E9%97%A8%E5%B0%86%E5%BE%AE%E8%B0%83%E7%9A%84%E5%90%84%E4%B8%AA%E6%96%B9%E6%B3%95%E7%9A%84%E5%9C%A8%E5%93%AA%E9%87%8C%E6%B2%A1%E6%89%BE%E5%88%B0-LOC_aillm-OR_chat-V_3-RC_llm"
langchain_tracing_v2: "false"
langchain_api_key: ""
langchain_project: only-subcribers
api_key: ""
api_host: 127.0.0.1
api_port: 8000
cors_allow_origins: []
# Trusted identity assigned after API-key authentication. Caller-provided
# identity fields or headers are ignored.
api_principal_id: api-key-client
api_tenant_id: ""
# Per-principal and per-tenant rolling-minute quotas for this one process.
quota_principal_requests_per_minute: 120
quota_tenant_requests_per_minute: 600
quota_principal_concurrent_calls: 4
quota_tenant_concurrent_calls: 16
quota_principal_searches_per_minute: 30
quota_tenant_searches_per_minute: 120
quota_principal_tokens_per_minute: 250000
quota_tenant_tokens_per_minute: 1000000
quota_principal_tool_calls_per_minute: 240
quota_tenant_tool_calls_per_minute: 1000
quota_principal_retries_per_minute: 600
quota_tenant_retries_per_minute: 3000
quota_principal_cost_units_per_minute: 500000
quota_tenant_cost_units_per_minute: 2000000
quota_max_tracked_identities: 4096
allow_low_relevance_generate: false
min_keyword_matches: 2
max_rewrites: 2
# Full chat history remains persisted; only this recent, bounded projection is
# passed to the agent and follow-up condensation model.
chat_context_max_turns: 8
chat_context_max_chars: 12000
planning_enabled: false
planning_max_subgoals: 4
planning_max_reflection_retries: 1
planning_critic_threshold: 0.7
web_search_enabled: true
# Optional compatibility mode. The normal path uses deterministic query cleanup.
web_search_llm_query_rewrite_enabled: false
web_search_provider: bing
# Optional provider priority list. Key-backed providers configured in the
# environment are automatically prioritized for Mandarin queries.
web_search_providers: []
web_search_provider_fanout: 2
web_search_max_results: 20
web_search_provider_timeout_seconds: 8
web_search_api_timeout_seconds: 20
web_search_deadline_seconds: 30
# REFACTOR: Canonical top-ranked search URLs to fetch before indexing.
web_search_top_k: 6
web_search_min_url_score: 45
web_search_region: wt-wt
web_search_timelimit: null
web_search_verify_ssl: true
web_search_lightweight: true
web_search_max_page_tokens: 8000
web_search_min_page_chars: 200
web_search_min_page_tokens: 50
web_search_js_fallback_enabled: false
web_search_js_fallback_domains:
  - baike.baidu.com
  - zhuanlan.zhihu.com
  - apps.microsoft.com
  - deepseek.net
web_search_js_force_domains: []
weather_enabled: false
stock_enabled: false
currency_enabled: false
wikipedia_enabled: false
directions_enabled: false
map_enabled: false
amap_api_timeout_seconds: 10
math_enabled: false
statistics_enabled: false
linalg_enabled: false
number_theory_enabled: false
datetime_enabled: false
summarize_url_enabled: false
file_read_enabled: false
file_read_root: "."
file_read_max_bytes: 5000000
# Word .docx editing. Needs file_read_enabled too; writes a new .docx next to
# the uploaded source and never overwrites it.
word_edit_enabled: false
# PowerPoint .pptx inspection/editing. Needs file_read_enabled too.
powerpoint_edit_enabled: false
# Excel .xlsx creation. Needs file_read_enabled and an artifact-tool runtime.
excel_create_enabled: false
excel_node_executable: "node"
excel_node_modules_path: ""
# Excel .xlsx editing. Needs file_read_enabled too; writes a session-scoped
# copy and never overwrites the uploaded source.
excel_edit_enabled: false
# Plain-text .txt creation and editing. Needs file_read_enabled too; writes
# session-scoped .txt files and never overwrites an existing file.
text_edit_enabled: false
# Markdown .md creation and editing. Needs file_read_enabled too; same
# session-scoped, never-overwrite model as the .txt editor.
markdown_edit_enabled: false
# Chat-agent long-term memory. Off by default; the store file is git-ignored.
memory_enabled: false
# Blank means memory/long_term_memory.json relative to the working directory.
memory_store_path: ""
memory_max_records: 500
memory_max_record_chars: 1000
memory_recall_top_k: 5
memory_context_max_chars: 2000
memory_default_scope: "global"
memory_auto_recall_enabled: true
# Automatic memory extraction. Off by default; one extra LLM call per extraction.
memory_extraction_enabled: false
memory_extraction_on_session_start: true
memory_extraction_turn_interval: 10
memory_extraction_max_candidates: 5
memory_extraction_max_transcript_chars: 8000
memory_extraction_timeout_seconds: 60
memory_extraction_max_concurrency: 2
memory_extraction_max_session_age_hours: 168
wikipedia_max_summary_chars: 1500
wikipedia_user_agent: "langgraph-rag/1.0 (contact: configure WIKIPEDIA_USER_AGENT)"
page_load_timeout: 15
page_load_max_concurrency: 4
page_load_cache_ttl_seconds: 0
# REFACTOR: Conservative pre-index filtering for loaded source documents.
document_quality_filter_enabled: true
document_quality_min_text_length: 80
document_quality_min_unique_terms: 8
document_quality_relevance_query: ""
document_quality_query_min_overlap: 1
document_quality_min_similarity: 0.5
document_quality_recency_bias_days: 365
# REFACTOR: Post-retrieval reranking strategy: lexical, embedding, or hybrid.
rerank_strategy: lexical
dashscope_request_timeout: 120
dashscope_max_retries: 3
dashscope_http_base_url: ""
