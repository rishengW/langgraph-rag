---
# Purpose: Local container orchestration for the chat service.

services:
  chat:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.frontend.chat.main", "serve", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # The container listens on 0.0.0.0, so it runs with the production
      # overlay: require_principal fails closed unless API_KEY is set.
      RAG_ENV: ${RAG_ENV:-production}
      API_KEY: ${API_KEY:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      CHROMA_DIR: /app/.chroma
      CHAT_API_HOST: 0.0.0.0
      CHAT_API_PORT: "8001"
    volumes:
      - chroma-data:/app/.chroma
      - session-data:/app/data
    restart: unless-stopped

volumes:
  chroma-data:
  session-data:
