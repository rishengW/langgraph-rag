<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>only Subcribers — Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1f2937;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }

        header {
            position: relative;
            min-height: 86px;
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        header #sessionControls {
            position: absolute;
            right: 24px;
        }

        h1 {
            font-size: clamp(36px, 6vw, 56px);
            font-weight: 800;
            letter-spacing: 0.04em;
            line-height: 1.2;
            padding-bottom: 0.12em;
            background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6, #10b981, #f59e0b);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 5px rgba(99, 102, 241, 0.22));
        }

        .start-screen,
        .transcript-screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .start-screen {
            padding: 24px;
            gap: 16px;
            overflow-y: auto;
            align-items: center;
            justify-content: center;
        }
        .start-screen > * {
            width: 100%;
            max-width: 640px;
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; font-weight: 500; color: #374151; }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.15s;
            resize: vertical;
        }
        textarea { min-height: 70px; }
        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .help-text { font-size: 11px; color: #6b7280; }

        .checkbox-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #374151;
        }
        input[type="checkbox"] { width: 16px; height: 16px; }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost {
            background: transparent; color: #4b5563;
            border: 1px solid #e5e7eb;
            padding: 6px 12px; font-size: 12px; font-weight: 500;
        }
        .btn-ghost:hover { background: #f9fafb; }

        .transcript {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #fafbff;
        }

        .turn {
            display: flex;
            gap: 10px;
            max-width: 88%;
        }
        .turn .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .turn.user { align-self: flex-end; }
        .turn.user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }
        .turn.assistant .bubble {
            background: white;
            color: #1f2937;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 2px;
        }
        .turn.assistant .bubble.markdown-preview {
            white-space: normal;
        }
        .markdown-preview p,
        .markdown-preview ul,
        .markdown-preview ol,
        .markdown-preview blockquote,
        .markdown-preview pre {
            margin: 0 0 10px;
        }
        .markdown-preview > :last-child { margin-bottom: 0; }
        .markdown-preview ul,
        .markdown-preview ol {
            padding-left: 20px;
        }
        .markdown-preview li + li { margin-top: 4px; }
        .markdown-preview h1,
        .markdown-preview h2,
        .markdown-preview h3,
        .markdown-preview h4,
        .markdown-preview h5,
        .markdown-preview h6 {
            font-size: 15px;
            line-height: 1.35;
            margin: 2px 0 8px;
        }
        .markdown-preview code {
            background: #f3f4f6;
            border-radius: 4px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 12px;
            padding: 1px 4px;
        }
        .markdown-preview pre {
            background: #111827;
            border-radius: 8px;
            color: #f9fafb;
            overflow-x: auto;
            padding: 10px 12px;
            white-space: pre;
        }
        .markdown-preview pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }
        .markdown-preview blockquote {
            border-left: 3px solid #c7d2fe;
            color: #4b5563;
            padding-left: 10px;
        }
        .markdown-preview table {
            border-collapse: collapse;
            margin: 0 0 10px;
            width: 100%;
            font-size: 13px;
        }
        .markdown-preview th,
        .markdown-preview td {
            border: 1px solid #e5e7eb;
            padding: 6px 10px;
            text-align: left;
            vertical-align: top;
        }
        .markdown-preview thead th {
            background: #f3f4f6;
            font-weight: 600;
        }
        .markdown-preview tbody tr:nth-child(even) td {
            background: #fafbff;
        }
        .markdown-preview a {
            color: #4f46e5;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .turn.thinking .bubble {
            background: white;
            color: #6b7280;
            border: 1px dashed #d1d5db;
            font-style: italic;
        }

        .composer {
            border-top: 1px solid #f0f0f0;
            padding: 14px 24px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .composer textarea {
            flex: 1;
            min-height: 44px;
            max-height: 160px;
            resize: none;
        }

        .session-info {
            font-size: 11px;
            color: #6b7280;
        }
        .session-info a { color: #4f46e5; }

        .attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 24px 8px;
        }
        .chip {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            border-radius: 12px;
            color: #3730a3;
            font-size: 11px;
            padding: 3px 10px;
        }
        .chip.error {
            background: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }
        #attachBtn { font-size: 16px; line-height: 1; }

        .error-banner {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin: 0 24px 14px;
        }

        .turn.has-artifacts {
            flex-direction: column;
        }
        .artifact-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(100%, 680px);
        }
        .amap-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(31, 41, 55, 0.08);
            overflow: hidden;
        }
        .file-card {
            align-items: center;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(31, 41, 55, 0.08);
            display: flex;
            gap: 12px;
            padding: 12px 14px;
        }
        .file-card__body {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .file-card__name {
            color: #111827;
            font-size: 13px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-card__meta {
            color: #6b7280;
            font-size: 12px;
        }
        .file-card__download {
            background: #4f46e5;
            border-radius: 8px;
            color: #fff;
            flex: 0 0 auto;
            font-size: 12px;
            font-weight: 600;
            margin-left: auto;
            padding: 7px 12px;
            text-decoration: none;
        }
        .file-card__download:hover {
            background: #4338ca;
        }
        .amap-card__header {
            align-items: center;
            display: flex;
            gap: 12px;
            justify-content: space-between;
            padding: 10px 12px;
        }
        .amap-card__title {
            color: #111827;
            font-size: 13px;
            font-weight: 700;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .amap-card__fallback {
            color: #4f46e5;
            flex: 0 0 auto;
            font-size: 12px;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .amap-card__map {
            align-items: center;
            background: #eef2ff;
            color: #4b5563;
            display: flex;
            justify-content: center;
            min-height: 260px;
            width: 100%;
        }
        .amap-card__status {
            font-size: 13px;
            padding: 16px;
            text-align: center;
        }
        .amap-card__labels {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 12px 12px;
        }
        .amap-card__chip {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            color: #374151;
            font-size: 11px;
            line-height: 1.35;
            padding: 4px 8px;
        }

        @media (max-width: 640px) {
            body { padding: 0; }
            .app {
                border-radius: 0;
                height: 100vh;
                max-width: none;
            }
            header,
            .composer {
                padding-left: 14px;
                padding-right: 14px;
            }
            header {
                align-items: flex-start;
                flex-direction: column;
            }
            .transcript {
                padding: 14px;
            }
            .turn {
                max-width: 96%;
            }
            .composer {
                flex-wrap: wrap;
                gap: 8px;
            }
            .composer textarea {
                flex-basis: calc(100% - 54px);
            }
            .composer #sendBtn {
                flex: 1 0 100%;
            }
            .session-info {
                display: block;
            }
            .amap-card__header {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }
            .amap-card__map {
                min-height: 220px;
            }
        }

        .hidden { display: none !important; }
    </style>
    <!-- KaTeX: typeset LaTeX math (\\[...\\], \\(...\\), $$...$$) in agent
         answers. Loaded deferred; renderMath() guards on availability so the
         page works even if these fail to load. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <div class="app">
        <header>
            <div>
                <h1>OnlySubscriber</h1>
            </div>
            <div id="sessionControls" class="hidden">
                <button id="newChatBtn" class="btn-ghost" type="button">New chat</button>
            </div>
        </header>

        <!-- Start screen: begin a conversation -->
        <section id="startScreen" class="start-screen">
            <div class="form-group">
                <label for="seedQuestion">What do you want to chat about?</label>
                <textarea id="seedQuestion" placeholder="e.g. &quot;Explain PAI fine-tuning best practices&quot; or &quot;Help me understand the latest research on...&quot;"></textarea>
                <div class="help-text">Just start typing — the assistant will decide when to search the web for the best answer.</div>
            </div>

            <button id="startBtn" class="btn-primary" type="button">Start chat</button>
            <div id="startError" class="help-text" style="color:#991b1b;"></div>
        </section>

        <!-- Chat screen -->
        <section id="chatScreen" class="transcript-screen hidden">
            <div id="transcript" class="transcript"></div>
            <div id="errorBanner" class="error-banner hidden"></div>
            <div id="attachments" class="attachments hidden"></div>
            <div class="composer">
                <input id="fileInput" type="file" class="hidden"
                    accept=".txt,.md,.log,.csv,.docx,.xlsx,.pptx,.pdf" multiple>
                <button id="attachBtn" class="btn-ghost" type="button"
                    title="Attach .txt, .md, .csv, .docx, .xlsx, .pptx, or .pdf files">📎</button>
                <textarea id="messageInput" placeholder="Ask a follow-up..." rows="1"></textarea>
                <button id="stopBtn" class="btn-ghost hidden" type="button" disabled
                    aria-label="Stop generating the current reply">Stop</button>
                <button id="sendBtn" class="btn-primary" type="button">Send</button>
            </div>
            <div class="composer session-info" id="sessionInfo"></div>
        </section>
    </div>

    <script src="/static/script.js?v=13"></script>
</body>
</html>
