<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>only Subcribers — Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1f2937;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 { font-size: 18px; }
        .subtitle { font-size: 12px; color: #6b7280; }

        .start-screen,
        .transcript-screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .start-screen { padding: 24px; gap: 16px; overflow-y: auto; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; font-weight: 500; color: #374151; }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.15s;
            resize: vertical;
        }
        textarea { min-height: 70px; }
        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .help-text { font-size: 11px; color: #6b7280; }

        .checkbox-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #374151;
        }
        input[type="checkbox"] { width: 16px; height: 16px; }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost {
            background: transparent; color: #4b5563;
            border: 1px solid #e5e7eb;
            padding: 6px 12px; font-size: 12px; font-weight: 500;
        }
        .btn-ghost:hover { background: #f9fafb; }

        .transcript {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #fafbff;
        }

        .turn {
            display: flex;
            gap: 10px;
            max-width: 88%;
        }
        .turn .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .turn.user { align-self: flex-end; }
        .turn.user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }
        .turn.assistant .bubble {
            background: white;
            color: #1f2937;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 2px;
        }
        .turn.thinking .bubble {
            background: white;
            color: #6b7280;
            border: 1px dashed #d1d5db;
            font-style: italic;
        }

        .composer {
            border-top: 1px solid #f0f0f0;
            padding: 14px 24px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .composer textarea {
            flex: 1;
            min-height: 44px;
            max-height: 160px;
            resize: none;
        }

        .session-info {
            font-size: 11px;
            color: #6b7280;
        }
        .session-info a { color: #4f46e5; }

        .error-banner {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin: 0 24px 14px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div>
                <h1>only Subscribers</h1>
                <div class="subtitle">Chat with web sources via RAG</div>
            </div>
            <div id="sessionControls" class="hidden">
                <button id="newChatBtn" class="btn-ghost" type="button">New chat</button>
            </div>
        </header>

        <!-- Start screen: pick sources -->
        <section id="startScreen" class="start-screen">
            <div class="form-group">
                <label for="seedQuestion">Topic or first question</label>
                <textarea id="seedQuestion" placeholder="What do you want to chat about? (e.g. PAI fine-tuning best practices)"></textarea>
                <div class="help-text">If Source URLs is empty, this seeds the web search.</div>
            </div>

            <div class="form-group">
                <label for="urls">Source URLs (optional)</label>
                <input type="text" id="urls" placeholder="https://example.com, https://another.com">
                <div class="help-text">Comma-separated. If filled, the topic is used only as your first message.</div>
            </div>

            <button id="startBtn" class="btn-primary" type="button">Start chat</button>
            <div id="startError" class="help-text" style="color:#991b1b;"></div>
        </section>

        <!-- Chat screen -->
        <section id="chatScreen" class="transcript-screen hidden">
            <div id="transcript" class="transcript"></div>
            <div id="errorBanner" class="error-banner hidden"></div>
            <div class="composer">
                <textarea id="messageInput" placeholder="Ask a follow-up..." rows="1"></textarea>
                <button id="sendBtn" class="btn-primary" type="button">Send</button>
            </div>
            <div class="composer session-info" id="sessionInfo"></div>
        </section>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
