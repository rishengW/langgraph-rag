<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>only Subcribers — Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1f2937;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 { font-size: 18px; }
        .subtitle { font-size: 12px; color: #6b7280; }

        .start-screen,
        .transcript-screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .start-screen { padding: 24px; gap: 16px; overflow-y: auto; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; font-weight: 500; color: #374151; }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.15s;
            resize: vertical;
        }
        textarea { min-height: 70px; }
        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .help-text { font-size: 11px; color: #6b7280; }

        .checkbox-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #374151;
        }
        input[type="checkbox"] { width: 16px; height: 16px; }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost {
            background: transparent; color: #4b5563;
            border: 1px solid #e5e7eb;
            padding: 6px 12px; font-size: 12px; font-weight: 500;
        }
        .btn-ghost:hover { background: #f9fafb; }

        .transcript {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #fafbff;
        }

        .turn {
            display: flex;
            gap: 10px;
            max-width: 88%;
        }
        .turn .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .turn.user { align-self: flex-end; }
        .turn.user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }
        .turn.assistant .bubble {
            background: white;
            color: #1f2937;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 2px;
        }
        .turn.assistant .bubble.markdown-preview {
            white-space: normal;
        }
        .markdown-preview p,
        .markdown-preview ul,
        .markdown-preview ol,
        .markdown-preview blockquote,
        .markdown-preview pre {
            margin: 0 0 10px;
        }
        .markdown-preview > :last-child { margin-bottom: 0; }
        .markdown-preview ul,
        .markdown-preview ol {
            padding-left: 20px;
        }
        .markdown-preview li + li { margin-top: 4px; }
        .markdown-preview h1,
        .markdown-preview h2,
        .markdown-preview h3,
        .markdown-preview h4,
        .markdown-preview h5,
        .markdown-preview h6 {
            font-size: 15px;
            line-height: 1.35;
            margin: 2px 0 8px;
        }
        .markdown-preview code {
            background: #f3f4f6;
            border-radius: 4px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 12px;
            padding: 1px 4px;
        }
        .markdown-preview pre {
            background: #111827;
            border-radius: 8px;
            color: #f9fafb;
            overflow-x: auto;
            padding: 10px 12px;
            white-space: pre;
        }
        .markdown-preview pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }
        .markdown-preview blockquote {
            border-left: 3px solid #c7d2fe;
            color: #4b5563;
            padding-left: 10px;
        }
        .markdown-preview table {
            border-collapse: collapse;
            margin: 0 0 10px;
            width: 100%;
            font-size: 13px;
        }
        .markdown-preview th,
        .markdown-preview td {
            border: 1px solid #e5e7eb;
            padding: 6px 10px;
            text-align: left;
            vertical-align: top;
        }
        .markdown-preview thead th {
            background: #f3f4f6;
            font-weight: 600;
        }
        .markdown-preview tbody tr:nth-child(even) td {
            background: #fafbff;
        }
        .markdown-preview a {
            color: #4f46e5;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .turn.thinking .bubble {
            background: white;
            color: #6b7280;
            border: 1px dashed #d1d5db;
            font-style: italic;
        }

        .composer {
            border-top: 1px solid #f0f0f0;
            padding: 14px 24px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .composer textarea {
            flex: 1;
            min-height: 44px;
            max-height: 160px;
            resize: none;
        }

        .session-info {
            font-size: 11px;
            color: #6b7280;
        }
        .session-info a { color: #4f46e5; }

        .attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 24px 8px;
        }
        .chip {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            border-radius: 12px;
            color: #3730a3;
            font-size: 11px;
            padding: 3px 10px;
        }
        .chip.error {
            background: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }
        #attachBtn { font-size: 16px; line-height: 1; }

        .error-banner {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin: 0 24px 14px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div>
                <h1>only Subscribers</h1>
                <div class="subtitle">Start a conversation — I'll search the web when needed</div>
            </div>
            <div id="sessionControls" class="hidden">
                <button id="newChatBtn" class="btn-ghost" type="button">New chat</button>
            </div>
        </header>

        <!-- Start screen: begin a conversation -->
        <section id="startScreen" class="start-screen">
            <div class="form-group">
                <label for="seedQuestion">What do you want to chat about?</label>
                <textarea id="seedQuestion" placeholder="e.g. &quot;Explain PAI fine-tuning best practices&quot; or &quot;Help me understand the latest research on...&quot;"></textarea>
                <div class="help-text">Just start typing — the assistant will decide when to search the web for the best answer.</div>
            </div>

            <button id="startBtn" class="btn-primary" type="button">Start chat</button>
            <div id="startError" class="help-text" style="color:#991b1b;"></div>
        </section>

        <!-- Chat screen -->
        <section id="chatScreen" class="transcript-screen hidden">
            <div id="transcript" class="transcript"></div>
            <div id="errorBanner" class="error-banner hidden"></div>
            <div id="attachments" class="attachments hidden"></div>
            <div class="composer">
                <input id="fileInput" type="file" class="hidden"
                    accept=".txt,.md,.log,.csv,.docx,.xlsx,.pdf" multiple>
                <button id="attachBtn" class="btn-ghost" type="button"
                    title="Attach .txt, .md, .csv, .docx, .xlsx, or .pdf files">📎</button>
                <textarea id="messageInput" placeholder="Ask a follow-up..." rows="1"></textarea>
                <button id="sendBtn" class="btn-primary" type="button">Send</button>
            </div>
            <div class="composer session-info" id="sessionInfo"></div>
        </section>
    </div>

    <script src="/static/script.js?v=3"></script>
</body>
</html>
